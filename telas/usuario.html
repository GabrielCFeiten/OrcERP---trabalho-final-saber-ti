<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuários | OrcERP</title>
    <link rel="stylesheet" href="../styles/style.css">
    <link rel="stylesheet" href="../styles/usuario.css">
</head>

<body>
    <nav class="navBar">
        <div class="navLogo"><a href="./inicio.html">OrcERP</a></div>
        <div class="navCat"><a href="./categoria.html">Categorias</a></div>
        <div class="navProd"><a href="./produto.html">Produtos</a></div>
        <div class="navCli"><a href="./cliente.html">Clientes</a></div>
        <div class="navOrc"><a href="./orcamento.html">Orçamentos</a></div>
        <div class="navUser active"><a href="./usuario.html">Usuários</a></div>
        <div class="navSair"><a href="./login.html">Sair</a></div>
    </nav>

    <div class="container">
        <header>
            <h1>Gerenciamento de Usuários</h1>
            <button id="btnNovoUsuario" class="btn btn-success">Add usuário (+)</button>
        </header>

        <main>
            <table id="tabelaUsuarios">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Username</th>
                        <th>Senha</th>
                        <th class="acoes">Ações</th>
                    </tr>
                </thead>
                <tbody id="corpoTabelaUsuarios"></tbody>
            </table>
        </main>
    </div>

    <div id="modalUsuario" class="modal">
        <div class="modal-content">
            <span class="fechar-modal" id="btnFecharModal">&times;</span>
            <h2 id="modalTituloUsuario">Adicionar Usuário</h2>

            <form id="formUsuario">
                <input type="hidden" id="usuarioId">

                <div class="form-group">
                    <label for="nomeUsuario">Nome:</label>
                    <input type="text" id="nomeUsuario" placeholder="Digite o nome do usuário" required>
                </div>

                <div class="form-group">
                    <label for="usernameUsuario">Username:</label>
                    <input type="text" id="usernameUsuario" placeholder="Digite o username do usuário" required>
                </div>

                <div class="form-group">
                    <label for="senhaUsuario">Senha:</label>
                    <div class="senha-container">
                        <input type="password" id="senhaUsuario" placeholder="Digite a senha do usuário" required>
                        <button type="button" id="btnAlternarSenha" class="btn-olho" title="Mostrar/Esconder senha">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="form-botoes">
                    <button type="button" id="btnCancelarUsuario" class="btn btn-secondary">Cancelar</button>
                    <button type="submit" class="btn btn-success">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="../scripts/controllers/UsuarioController.js"></script>
</body>

</html>
