<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | OrcERP</title>
</head>
<body>
    <div class="loginContainer">
        <form id="formLogin" class="loginForm">
            <label for="username" class="loginLabel">Usuário:</label>
            <input type="text" id="username" class="loginInput" name="username" required>
            
            <label for="password" class="loginLabel">Senha:</label>
            <input type="password" class="loginInput" id="password" name="password" required>
            
            <button type="submit" id="btnEntrar">Entrar</button>
            <button type="button" id="btnEsqueciSenha">Esqueci senha</button>
        </form>
    </div>

    <script type="module" src="../../scripts/controllers/Login.js"></script>
</body>
</html>
